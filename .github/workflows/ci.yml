name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx  # for TestClient
      - name: Pytest
        run: |
          cd backend
          python -m pytest -q
      - name: Pip audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
      - name: Docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose OK"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Audit
        run: cd frontend && npm audit --audit-level=high || true
      - name: Jest smoke
        run: |
          cd frontend && npm install --save-dev jest && npx jest --passWithNoTests || true
      - name: Build
        run: cd frontend && npm run build || echo "build skipped (no pages yet)"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff
      - name: Terraform validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .env not tracked
        run: |
          if git ls-files | grep -q "^\.env$"; then echo ".env tracked! FAIL"; exit 1; fi
          echo "secrets check OK"
      - name: GitHub Actions secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
