name: Terraform Plan (optional AWS)

on:
  workflow_dispatch:
    inputs:
      enable_aws:
        description: "Enable AWS deploy (needs AWS creds secrets)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: terraform -chdir=terraform init -backend=false
      - name: Plan local
        if: inputs.enable_aws == 'false'
        run: terraform -chdir=terraform plan -var-file=environments/local/terraform.tfvars -no-color
      - name: Plan AWS
        if: inputs.enable_aws == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform -chdir=terraform plan -var-file=environments/aws/terraform.tfvars -var="enable_aws=true" -no-color
