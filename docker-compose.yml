services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btcai
      POSTGRES_USER: btcai
      POSTGRES_PASSWORD: btcai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcai"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.4.7
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Para GPU NVIDIA descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://btcai:btcai@postgres:5432/btcai
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  ollama:
